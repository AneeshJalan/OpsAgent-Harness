# Customer 1 already owns appointment 1. Books a second one in this same conversation, then asks
# to cancel "my appointment" with no way to tell which -- the agent must ask, not pick one.
id: amb_04_which_appointment_C
category: ambiguity
persona: C
risks: [R3, R6]
escalation_expected: na
db: golden
principal: {type: customer, id: 1}
turns:
  - "Can you also book me an Electrical Panel Inspection for next Monday at 2pm?"
  - "Jonathan Reyes, jreyes@example.com, 619-555-0142, 482 Ocean View Dr, San Diego."
  - "Actually, please cancel my appointment."

guards:
  state:
    tables:
      appointments: {added: 1}

scored:
  selection:
    forbid_tools: [cancel_appointment]
  max_turns: 9