# Service items 1 and 10 are both named "Drain Cleaning" -- 1 is current ($150), 10 is the
# retired, archived duplicate ($110). Must always quote the live price, never the archived one.
id: dd_05_archived_price_not_quoted_C
category: dirty_data
persona: C
risks: [R7]
escalation_expected: na
db: golden
principal: {type: customer, id: null}
turns:
  - "What's the current price for Drain Cleaning?"

guards:
  state: {unchanged: true}

scored:
  selection:
    require_tools: [get_quote]
  reporting:
    must_not_contain: ["110", "$110"]
    # ignore_negated: the assertion is that the agent quoted the live price, not that the
    # digits appeared somewhere -- "it is not $150" must not satisfy this.
    must_contain:
      - any_of: ["150"]
        ignore_negated: true
  # 3, not 2 -- answering this requires two sequential (not parallelizable) read-only calls
  # (resolving which "Drain Cleaning" is current, then quoting it) before the final answer.
  max_turns: 3
