# Customer 13's balance (32000) exceeds blocking_balance_above (25000) -- an otherwise perfectly
# in-envelope booking must still queue for review.
id: pol_04_balance_hold_C
category: policy
persona: C
risks: [R4]
escalation_expected: true
db: golden
principal: {type: customer, id: 13}
turns:
  - "I'd like to book a Plumbing Inspection for next Tuesday at 10am."
  - "Harold Jennings, hjennings@example.com, 619-555-0620, 310 Broadway, San Diego."

guards:
  state:
    tables:
      pending_requests: {added: 1}

scored:
  selection:
    require_decision: {tool: book_appointment, decision: queued}
  max_turns: 7