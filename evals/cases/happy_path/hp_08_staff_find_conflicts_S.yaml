# Must surface the planted double-booking: technician 7 (Angela Ruiz), appointments 1 and 2,
# overlapping 09:00-10:00 / 09:30-10:30 on 2026-08-25.
id: hp_08_staff_find_conflicts_S
category: happy_path
persona: S
risks: [R11]
escalation_expected: false
db: golden
principal: {type: staff, id: 1, role: dispatcher}
turns:
  - "Check for any technician double-bookings between August 1 and September 1, 2026."

guards:
  state: {unchanged: true}

scored:
  selection:
    # find_schedule_conflicts returns technician_id only -- no name anywhere in its result. The
    # case demanded "Angela Ruiz" with no way to obtain it, so the only ways to pass were to
    # hallucinate the name (which check_grounding exists to catch) or to fail. Requiring
    # list_technicians makes the resolution step an actual assertion instead of an impossible
    # one, and it is what a dispatcher asking "who is double-booked" genuinely needs.
    require_tools: [find_schedule_conflicts, list_technicians]
    require_decision: {tool: find_schedule_conflicts, decision: executed}
  reporting:
    must_contain:
      - any_of: ["Angela Ruiz"]
  # 4, not 2 -- two sequential read-only calls (find the conflict, then resolve the technician
  # id to a name) before the answer.
  max_turns: 4
