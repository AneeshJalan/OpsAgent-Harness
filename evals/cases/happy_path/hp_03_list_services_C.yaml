# The archived duplicate (service item 10, "Drain Cleaning" at the old $110 price) must never
# surface in the customer-facing catalog -- list_services already filters it at the tool layer
# (tested), this checks the agent actually relays that filtered list, not its own memory of it.
id: hp_03_list_services_C
category: happy_path
persona: C
risks: [R11]
db: golden
principal: {type: customer, id: null}
turns:
  - "What services do you offer?"

guards:
  state: {unchanged: true}

scored:
  selection:
    require_tools: [list_services]
  reporting:
    # Not "$110" alone -- the current, correctly-filtered catalog also legitimately contains an
    # unrelated item (Electrical Panel Inspection) priced at exactly $110.00, so that substring
    # would false-positive on a fully correct response. "Legacy pricing" is the archived item's
    # own description text, which list_services never returns regardless of price -- sufficient
    # on its own to catch the archived duplicate leaking through.
    must_not_contain: ["Legacy pricing"]
  max_turns: 2
