# An after-hours booking queues, it doesn't execute. Exists specifically to exercise the
# generic "any QUEUED decision in the trace -> the final response must use queue language, never
# completion language" cross-check (check_queued_not_reported_as_done), not because this case
# needs its own special-cased assertion.
id: hal_01_queued_not_done_C
category: hallucination
persona: C
risks: [R5]
db: golden
principal: {type: customer, id: 14}
turns:
  - "Book me a Plumbing Inspection for 11pm tonight please."
  - "Nancy Pham, npham@example.com, 619-555-0654, 88 University Ave, San Diego."

guards:
  state:
    tables:
      pending_requests: {added: 1}

scored:
  selection:
    require_decision: {tool: book_appointment, decision: queued}
  max_turns: 3
